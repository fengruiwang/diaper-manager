name: XiaoBao T06 V1.2.0 rc8 root-PWA upgrade candidate (NO DEPLOY)
on:
  push:
    branches:
      - feature/cloudbase-sync-v1.2.0
    paths:
      - 'release-candidate/pages-v1.2.0-rc8/**'
      - 'scripts/build-pages-v120-rc8.cjs'
      - 'tests/pages-v120-rc8.test.cjs'
      - 'tests/historical-candidate-baselines.cjs'
      - '.github/workflows/pages-v120-rc8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc8-candidate:
    name: RC8 immutable build, P1/P2 contract and full JS (NO DEPLOY)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by the builder's pinned git show SOURCE_SHA:path
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify deterministic RC8 build from audited source SHA (14 files)
        run: node scripts/build-pages-v120-rc8.cjs --check
      - name: Verify pinned resources, PWA upgrade, cold start, pull-refresh and writes
        run: node --test tests/pages-v120-rc8.test.cjs
      - name: Run full JavaScript regression
        run: node --test tests/*.test.cjs
      - name: Archive RC8 static candidate only (NO DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: XiaoBao-V1.2.0-RC8-NO-DEPLOY
          path: release-candidate/pages-v1.2.0-rc8/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

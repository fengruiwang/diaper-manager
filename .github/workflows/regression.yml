name: XiaoBao regression
on:
  push:
    branches:
      - main
      - feature/growth-v1.1.0
      - feature/replenishment-v1.1.1
      - feature/weight-auto-stock-v1.1.2
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript and migration compatibility
        run: node --test tests/*.test.cjs

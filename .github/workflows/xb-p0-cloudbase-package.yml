name: XiaoBao P4-03D REFONLY test bundle (PRE-APPROVAL)
on:
  push:
    branches:
      - feature/cloudbase-sync-v1.2.0
    paths:
      - 'deploy/xb-test/formal/**'
      - 'deploy/xb-test/p4-02b-readonly-rollback/**'
      - '.github/workflows/xb-p0-cloudbase-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source + read-only production + reference-only test gates + rollback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          # P4-03D deployed test package remains a FROZEN snapshot: new
          # P4-03E source changes must not silently rewrite that artifact.
          FROZEN='d6ecd9ac803742e2962c011a18be99255fb938db'
          def frozen(path):
            return subprocess.check_output(['git','show',FROZEN+':'+path]).decode('utf-8')
          SHA='38af54df8b381a30598967f9b5a4061d01a456cb';V='38af54d'
          base=Path('deploy/xb-test/formal')
          def change_once(s,a,b):
            assert s.count(a)==1,(s.count(a),a[:80])
            return s.replace(a,b)
          html=frozen('preview/v1.2.0/formal/index.html')
          html=change_once(html,
            '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />',
            '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />\n'
            '<meta name="xiaobao-p4-03d-source-sha" content="'+SHA+'" />')
          html=change_once(html,
            '<strong>小宝管家 V1.2.0 · 正式业务测试入口</strong>',
            '<strong>小宝管家 V1.2.0 · P4-03D 参考价保存反馈验收包（未经批准禁止上传）</strong>')
          html=change_once(html,
            '<div id="formalSyncState" class="fine">等待正式 primary；目前不允许真实云端业务写入。</div>',
            '<div id="formalSyncState" class="fine">等待正式 primary；本测试包仅用于获批后的参考价保存反馈验证，其他业务写入关闭。</div>')
          html=change_once(html,
            '<script src="../m1-controller.js" defer></script>',
            '<script src="./m1-controller.js?v='+V+'" defer></script>')
          html=change_once(html,
            '<script src="../formal-controller.js" defer></script>',
            '<script src="./formal-controller.js?v='+V+'" defer></script>')
          assert html==(base/'index.html').read_text('utf-8')
          source=frozen('preview/v1.2.0/formal-controller.js')
          assert 'const FORMAL_WRITE_ENABLED=false;' in source
          assert 'const FORMAL_PURCHASE_ENABLED=false;' in source
          derived=change_once(source,'const FORMAL_WRITE_ENABLED=false;',
            'const FORMAL_WRITE_ENABLED=true;')
          derived=change_once(derived,
            '    referenceAndQuotes:true,allowGrowth:true,allowProfile:true,allowSettings:true',
            '    referenceOnly:true,referenceAndQuotes:false,allowGrowth:false,allowProfile:false,allowSettings:false')
          derived=change_once(derived,
            '      allowReference:true,allowQuotes:true,allowGrowth:true,allowProfile:true,\n      allowSettings:true,',
            '      allowReference:true,allowQuotes:false,allowGrowth:false,allowProfile:false,\n      allowSettings:false,')
          derived=change_once(derived,
            '      purchaseOnly:true,allowConsume:true,allowReverse:true,\n      allowStocktake:true,readStocktakeBaseline:',
            '      purchaseOnly:true,allowConsume:false,allowReverse:false,\n      allowStocktake:false,readStocktakeBaseline:')
          derived=change_once(derived,
            '   purchaseOnly:true,allowConsume:true,allowReverse:true,\n    allowStocktake:true\n',
            '   purchaseOnly:true,allowConsume:false,allowReverse:false,\n    allowStocktake:false\n')
          old='正式宝宝及五类共享文档已验证；本测试版本关闭云端写入。'
          assert derived.count(old)==2
          derived=derived.replace(old,
            '正式宝宝及五类共享文档已验证；仅参考价保存反馈验收可用，其他业务写入关闭。')
          assert derived==(base/'formal-controller.js').read_text('utf-8')
          assert 'const FORMAL_WRITE_ENABLED=true;' in derived
          assert 'const FORMAL_PURCHASE_ENABLED=false;' in derived
          assert (base/'m1-controller.js').read_text('utf-8')==frozen('preview/v1.2.0/m1-controller.js')
          assert "const ENV_ID='f495637659-d2gnuzz2jf5657da8'" in (base/'m1-controller.js').read_text('utf-8')
          assert 'Object.hasOwn(' not in html
          for name in ['inventory-reconciler','primary-cloud-read-model',
            'primary-ui-projection','primary-cloud-operations','primary-documents-client',
            'primary-documents-overlay','primary-documents-operations',
            'primary-documents-business-commands','primary-formal-ui-actions',
            'primary-stocktake-batch-client']:
            assert frozen('sync/'+name+'.js').strip() in html,name
          backup=Path('deploy/xb-test/p4-02b-readonly-rollback')
          expected={
            'index.html':'232f79f1d8b268af79133ffed9811d6d148e7353',
            'formal-controller.js':'772ed34d9f5d00b663d99cf22cea7bc758269f73',
            'm1-controller.js':'542d0a9a1b01b4ec44fde4a26b873835f66d0043'
          }
          for file,blob_sha in expected.items():
            data=(backup/file).read_bytes()
            digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert digest==blob_sha,(file,digest)
          assert 'const FORMAL_WRITE_ENABLED=false;' in (backup/'formal-controller.js').read_text('utf-8')
          assert 'const FORMAL_PURCHASE_ENABLED=false;' in (backup/'formal-controller.js').read_text('utf-8')
          print('P4_03D_REFERENCE_ONLY_TEST_PACKAGE_AND_READONLY_ROLLBACK_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBao-P4-03D-REFONLY-38af54d
          path: |
            deploy/xb-test/formal/index.html
            deploy/xb-test/formal/m1-controller.js
            deploy/xb-test/formal/formal-controller.js
            deploy/xb-test/formal/README_UPLOAD.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBao-P4-02B-READONLY-ROLLBACK
          path: |
            deploy/xb-test/p4-02b-readonly-rollback/index.html
            deploy/xb-test/p4-02b-readonly-rollback/m1-controller.js
            deploy/xb-test/p4-02b-readonly-rollback/formal-controller.js
          if-no-files-found: error
          retention-days: 30

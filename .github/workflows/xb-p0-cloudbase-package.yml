name: XiaoBao P0 CloudBase upload package
on:
  push:
    branches:
      - feature/cloudbase-sync-v1.2.0
    paths:
      - 'deploy/xb-test/formal/**'
      - '.github/workflows/xb-p0-cloudbase-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact package and unchanged authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('deploy/xb-test/formal')
          html=(d/'index.html').read_text('utf-8')
          assert 'src="./m1-controller.js?v=da93ab1"' in html
          assert 'src="./formal-controller.js?v=da93ab1"' in html
          assert 'name="xiaobao-p0-source-sha" content="da93ab12bce17f735a16d5dbc5ef32b24ef3c070"' in html
          assert (d/'m1-controller.js').read_bytes()==Path('preview/v1.2.0/m1-controller.js').read_bytes()
          assert (d/'formal-controller.js').read_bytes()==Path('preview/v1.2.0/formal-controller.js').read_bytes()
          assert 'const FORMAL_WRITE_ENABLED=false' in (d/'formal-controller.js').read_text('utf-8')
          assert "const ENV_ID='f495637659-d2gnuzz2jf5657da8'" in (d/'m1-controller.js').read_text('utf-8')
          print('P0_STARTUP_PERF_PACKAGE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBao-P0-CloudBase-da93ab1
          path: |
            deploy/xb-test/formal/index.html
            deploy/xb-test/formal/m1-controller.js
            deploy/xb-test/formal/formal-controller.js
            deploy/xb-test/formal/README_UPLOAD.txt
          if-no-files-found: error
          retention-days: 30

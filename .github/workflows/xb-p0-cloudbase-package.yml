name: XiaoBao P1-01 Chrome CloudBase package
on:
  push:
    branches:
      - feature/cloudbase-sync-v1.2.0
    paths:
      - 'deploy/xb-test/formal/**'
      - '.github/workflows/xb-p0-cloudbase-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source parity and Chrome compatible formal data chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('deploy/xb-test/formal')
          html=(base/'index.html').read_text('utf-8')
          assert 'src="./m1-controller.js?v=0f7e50b"' in html
          assert 'src="./formal-controller.js?v=0f7e50b"' in html
          assert 'name="xiaobao-p1-source-sha" content="0f7e50b365ab6f7b23e699f5ee78c00981d627f3"' in html
          assert 'Object.hasOwn(' not in html
          assert (base/'m1-controller.js').read_bytes()==Path('preview/v1.2.0/m1-controller.js').read_bytes()
          assert (base/'formal-controller.js').read_bytes()==Path('preview/v1.2.0/formal-controller.js').read_bytes()
          for name in ['inventory-reconciler','primary-cloud-read-model',
                       'primary-ui-projection','primary-cloud-operations',
                       'primary-documents-overlay']:
            source=Path('sync/'+name+'.js').read_text('utf-8').strip()
            assert source in html, name+' inline version mismatch'
            assert 'Object.hasOwn(' not in source
          assert 'const FORMAL_WRITE_ENABLED=false' in (base/'formal-controller.js').read_text('utf-8')
          assert "const ENV_ID='f495637659-d2gnuzz2jf5657da8'" in (base/'m1-controller.js').read_text('utf-8')
          print('P1_01_CHROME_COMPAT_PACKAGE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBao-P1-01-Chrome-0f7e50b
          path: |
            deploy/xb-test/formal/index.html
            deploy/xb-test/formal/m1-controller.js
            deploy/xb-test/formal/formal-controller.js
            deploy/xb-test/formal/README_UPLOAD.txt
          if-no-files-found: error
          retention-days: 30

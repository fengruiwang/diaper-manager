name: XiaoBao P1-01 CloudBase upload package
on:
  push:
    branches:
      - feature/cloudbase-sync-v1.2.0
    paths:
      - 'deploy/xb-test/formal/**'
      - '.github/workflows/xb-p0-cloudbase-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify strict P1-01 deployment source and no writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('deploy/xb-test/formal')
          html=(base/'index.html').read_text('utf-8')
          assert 'src="./m1-controller.js?v=92c7923"' in html
          assert 'src="./formal-controller.js?v=92c7923"' in html
          assert 'name="xiaobao-p1-source-sha" content="92c7923676b5fd1dd6b8cd2b4de111c21af14d2a"' in html
          assert (base/'m1-controller.js').read_bytes()==Path('preview/v1.2.0/m1-controller.js').read_bytes()
          assert (base/'formal-controller.js').read_bytes()==Path('preview/v1.2.0/formal-controller.js').read_bytes()
          for p in ['primary-ui-projection','primary-documents-overlay']:
           src=Path('sync/'+p+'.js').read_text('utf-8').strip()
           assert src in html, 'inline module mismatch '+p
          assert 'const FORMAL_WRITE_ENABLED=false' in (base/'formal-controller.js').read_text('utf-8')
          assert "const ENV_ID='f495637659-d2gnuzz2jf5657da8'" in (base/'m1-controller.js').read_text('utf-8')
          print('P1_01_CLOUDBASE_PACKAGE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBao-P1-01-CloudBase-92c7923
          path: |
            deploy/xb-test/formal/index.html
            deploy/xb-test/formal/m1-controller.js
            deploy/xb-test/formal/formal-controller.js
            deploy/xb-test/formal/README_UPLOAD.txt
          if-no-files-found: error
          retention-days: 30
